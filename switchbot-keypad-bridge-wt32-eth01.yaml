# SwitchBot Keypad Bridge — WT32-ETH01 (wired Ethernet / ESP-LAN) variant.
#
# Identical firmware to the Wi-Fi build; it just reaches the network over the
# WT32-ETH01's on-board LAN8720 Ethernet PHY instead of Wi-Fi. Useful where
# Wi-Fi is weak at the door, or when you want a reliable wired access
# controller.
#
# Note on the radio: on the ESP32, BLE and wired Ethernet do NOT share the
# radio (unlike Wi-Fi + BLE), so this is actually a cleaner combination —
# the BLE link to the keypad never competes with network traffic.
#
# Board: WT32-ETH01 = ESP32-WROOM-32 (plain ESP32, no PSRAM, 4 MB flash).

esphome:
  name: switchbot-keypad-bridge

esp32:
  board: esp32dev            # WT32-ETH01 is a plain ESP32-WROOM-32
  framework:
    type: esp-idf            # required: PSA crypto, NimBLE, esp_http_server

# The component ships in this repo. Using the LOCAL copy means your fork's
# changes take effect immediately, without pushing to GitHub first. To pull
# it straight from your fork instead, swap this for:
#   - source: github://cyberapp-l/switchbot-keypad-bridge
#     components: [switchbot_keypad_bridge]
external_components:
  - source:
      type: local
      path: components
    components: [switchbot_keypad_bridge]

# ── Wired Ethernet on the WT32-ETH01 (LAN8720 RMII PHY) ────────────────────
# Reserved pins: GPIO0 (50 MHz clock in), GPIO23 (MDC), GPIO18 (MDIO),
# GPIO16 (PHY power), plus the fixed RMII data lines
# (GPIO19/21/22/25/26/27). Don't use any of these for anything else.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_EXT_IN  # 50 MHz clock fed in on GPIO0
    pin: 0
  phy_addr: 1
  power_pin: GPIO16
  # DHCP is the default. To pin a static address, uncomment:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #
  # Troubleshooting: if the link never comes up on your board revision, try
  # removing `power_pin` — a few early WT32-ETH01 units wire GPIO16
  # differently. The rest of the pin-out is fixed by the board.

logger:
  level: VERBOSE

api:
  # Exposes a Home Assistant service `esphome.<device>_send_keypad_command`.
  # (switchbot_keypad_bridge.send_command is an ESPHome *action* — a YAML
  # building block — so it is NOT itself an HA service; this wrapper makes it
  # one.) Call it from HA → Developer Tools → Actions with a hex command, e.g.
  #   command: "0f52010c0202"   # volume — hypothesis, see docs/protocol.md
  # The decrypted reply is logged at WARN (send_command: … decrypted=…).
  actions:
    - action: send_keypad_command
      variables:
        command: string
      then:
        - switchbot_keypad_bridge.send_command:
            command: !lambda "return command;"

ota:
  - platform: esphome
    password: !secret ota_password

# TLS in the pairing wizard needs a valid system clock; SNTP keeps it set
# even before Home Assistant connects.
time:
  - platform: sntp

switchbot_keypad_bridge:
  keypad_action:
    name: "Action"

  keypad:
    name: "Keypad"

  # Keypad battery, read from its BLE advertisement once per scan interval.
  battery_level:
    name: "Keypad Battery"

  # ↓ battery_scan_interval is a SIBLING of battery_level (2-space indent),
  #   NOT nested under it. Minimum 30s. You can also set it live in the web
  #   console → Settings tab (no reflash).
  # battery_scan_interval: 15min

  unpair_button:
    name: "Unpair"

  # "Who unlocked" diagnostics (resolved from the users: map below).
  last_user:
    name: "Last User"
  last_method:
    name: "Last Method"

  # Keypad liveness / signal (diagnostic).
  rssi:
    name: "Keypad Signal"
  keypad_connected:
    name: "Keypad Connected"
  last_seen:
    name: "Keypad Last Seen"
    device_class: timestamp

  # Alarm / status flags (Keypad Vision only), read on the battery scan — lower
  # battery_scan_interval if you want them picked up sooner.
  #   tamper  = pried off its mount   duress = a duress/panic code was entered
  #   lockout = too many wrong tries  motion = PIR/radar  charging = on charger
  tamper:
    name: "Keypad Tamper"
  duress:
    name: "Keypad Duress"
  lockout:
    name: "Keypad Lockout"
  motion:
    name: "Keypad Motion"
  charging:
    name: "Keypad Charging"

  on_tamper:
    - homeassistant.event:
        event: esphome.switchbot_keypad_tamper
  on_duress:
    - homeassistant.event:
        event: esphome.switchbot_keypad_duress

  # Drop duplicate unlocks from the same credential within this window.
  min_unlock_interval: 3s

  # Protect the always-on web console (pairing wizard + config) with a login.
  # Omit web_password to leave it open on the LAN. Username defaults to "admin".
  # web_username: "admin"
  # web_password: !secret web_password

  # Debug/advanced: after pairing, show the keypad's communication key
  # (key_id + K14) in the web console → Settings, and log it. It is a secret —
  # only for decrypting your own BLE captures / reverse-engineering. Off here.
  # show_communication_key: true

  # users:
  #   - name: "Liran"
  #     method: fingerprint
  #     index: 0

  on_unlock:
    # method: "pin" | "fingerprint" | "nfc" | "face" | "unknown"
    # index:  credential slot         name: resolved user (from users:, may be empty)
    - homeassistant.event:
        event: esphome.switchbot_keypad_unlock
        data:
          method: !lambda 'return method;'
          index: !lambda 'return to_string(index);'
          name: !lambda 'return name;'

  # on_lock:
  #   - logger.log: "Locked"

  # on_doorbell:
  #   - logger.log: "Doorbell pressed"

# Experiment helper for the raw-command action (see docs/protocol.md). It never
# runs on its own — call `keypad_set_volume` from the API / HA dev tools to try
# the (unverified) volume command and watch the decrypted reply in the log.
# `key`/`key_id` are omitted, so it reuses the paired communication key.
script:
  - id: keypad_set_volume
    parameters:
      level: int # 1 = low, 2 = medium, 3 = high
    then:
      - switchbot_keypad_bridge.send_command:
          # 0f 52 01 0c <level> 02  — volume SET (hypothesis; verify on hardware)
          command: !lambda |-
            char buf[13];
            sprintf(buf, "0f52010c0%d02", level);
            return std::string(buf);
